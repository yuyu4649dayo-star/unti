canvas{display:block;touch-action:none}

#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#fffa;border-radius:50%;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;font-size:15px;display:none;white-space:nowrap;pointer-events:none}
#toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);background:#1d2440f0;border-left:4px solid #6c8cff;padding:12px 16px;border-radius:8px;max-width:640px;width:92%;font-size:14px;line-height:1.7;display:none;pointer-events:none}
#tut{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#2a2110f2;border:1px solid #ffd166;border-radius:10px;padding:10px 12px 10px 14px;max-width:640px;width:92%;font-size:14px;line-height:1.6;display:none;z-index:4;box-sizing:border-box;align-items:center;gap:10px}
#tut .txt{flex:1}
#tut .tag{color:#ffd166;font-weight:bold;font-size:12px;display:block}
#tutSkip{background:#00000066;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;touch-action:none}
.iconbtn{position:fixed;top:10px;width:40px;height:40px;border-radius:50%;background:#000a;border:1px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:10;cursor:pointer;touch-action:none}
#mailBtn{right:60px}
#mute{right:12px}
#ledgerBtn{right:156px}
#setBtn{right:204px}
#clock{position:fixed;top:10px;left:10px;z-index:9;background:#000a;border:1px solid #ffffff44;border-radius:10px;padding:6px 10px;font-size:14px;color:#fff;pointer-events:none}
#achBtn{right:108px}
#panel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#pbox{background:#1a1f35;border:1px solid #2c3558;border-radius:14px;padding:20px;max-width:580px;width:100%;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;line-height:1.7}
#pwrap{position:relative;max-width:580px;width:100%}
#pclose{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#0c1020;border:1px solid #2c3558;color:#fff;font-size:18px;cursor:pointer;z-index:2;display:none;font-family:inherit}
#pbox h3{margin:0 0 8px}
.btn{display:block;width:100%;text-align:left;background:#0c1020;border:1px solid #2c3558;color:#fff;border-radius:10px;padding:12px 14px;margin:6px 0;font-size:16px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:#6c8cff}
.btn.on{border-color:#3ddc97}
.btn.primary{background:#6c8cff;text-align:center;font-weight:bold;border:none}
.inp{width:100%;padding:10px;border-radius:8px;border:1px solid #2c3558;background:#0c1020;color:#fff;margin:4px 0;font-size:16px;box-sizing:border-box;font-family:inherit}

// ===== 端末判定 =====
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if(isTouch) document.body.classList.add('touch');
const K_ACT = isTouch ? '「調べる」ボタン' : 'Eキー';
const K_DROP = isTouch ? '「置く」ボタン' : 'Qキー';
document.getElementById('startText').innerHTML = isTouch
  ? '左下のスティックで歩く　画面の右側をなぞって見回す<br>右下の「調べる」で取る・取り付ける・押す　「置く」で部品を戻す<br>注文メールは右上の📩で読み返せます'
  : 'WASD：歩く　マウス：見回す　E：調べる・取る・取り付ける<br>Q：持っている部品を元に戻す　Esc：マウスを解放<br>注文メールは右上の📩で読み返せます';

// ===== 効果音（Web Audioで合成。音声ファイル不要） =====
let actx = null, muted = false;
function ensureAudio(){
  if(!actx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    actx = new C();
  }
  if(actx.state === 'suspended') actx.resume();
}
function tone({f=440, f2=null, dur=0.12, type='sine', vol=0.2, delay=0, attack=0.005}){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise({dur=0.1, vol=0.2, delay=0, hp=null, bp=null}){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter();
  if(bp){ filt.type = 'bandpass'; filt.frequency.value = bp; }
  else { filt.type = 'highpass'; filt.frequency.value = hp || 800; }
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(filt); filt.connect(g); g.connect(actx.destination);
  src.start(t);
}
const SFX = {
  bell(){ tone({f:1568,dur:0.7,type:'triangle',vol:0.28}); tone({f:2093,dur:0.7,type:'triangle',vol:0.22,delay:0.08}); },
  click(){ tone({f:900, dur:0.04, type:'square', vol:0.06}); },
  open(){ tone({f:520, f2:780, dur:0.1, type:'triangle', vol:0.12}); },
  pickup(){ tone({f:330, f2:520, dur:0.12, type:'triangle', vol:0.15}); noise({dur:0.05, vol:0.06, hp:1200}); },
  heavy(){ tone({f:140, f2:220, dur:0.2, type:'sine', vol:0.25}); noise({dur:0.12, vol:0.12, hp:300}); },
  place(){ noise({dur:0.05, vol:0.25, hp:1500}); tone({f:200, f2:110, dur:0.08, type:'square', vol:0.08}); },
  screw(){ noise({dur:0.025, vol:0.18, bp:3500}); tone({f:2400, dur:0.02, type:'square', vol:0.03}); },
  wrong(){ tone({f:170, f2:110, dur:0.3, type:'sawtooth', vol:0.12}); },
  error(){ tone({f:220, dur:0.12, type:'square', vol:0.08}); tone({f:180, dur:0.12, delay:0.15, type:'square', vol:0.08}); },
  power(){ [523,659,784].forEach((f,i) => tone({f, dur:0.18, type:'triangle', vol:0.15, delay:i*0.1})); noise({dur:0.8, vol:0.03, hp:200}); },
  success(){ [523,659,784,1047].forEach((f,i) => tone({f, dur:0.25, type:'triangle', vol:0.16, delay:i*0.12})); },
  fail(){ tone({f:320, f2:140, dur:0.55, type:'sawtooth', vol:0.14}); },
  bag(){ noise({dur:0.14, vol:0.1, hp:2800}); },
  pad(){ noise({dur:0.18, vol:0.12, hp:500}); },
  box(){ noise({dur:0.1, vol:0.12, hp:600}); tone({f:120, f2:60, dur:0.12, type:'sine', vol:0.2}); },
  tape(){ noise({dur:0.3, vol:0.2, hp:2500}); },
  whoosh(){ noise({dur:0.6, vol:0.14, bp:1200}); },
  cash(){ tone({f:1319, dur:0.08, type:'square', vol:0.08}); tone({f:1760, dur:0.22, type:'square', vol:0.08, delay:0.08}); },
  step(){ noise({dur:0.035, vol:0.05, hp:400}); },
  ding(){ tone({f:1047, dur:0.25, type:'sine', vol:0.12}); },
};
function setMuted(v){
  muted = v;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}
const muteEl = document.getElementById('mute');
muteEl.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); setMuted(!muted); if(!muted) SFX.click(); });
document.addEventListener('pointerdown', ensureAudio);

function checks(){
  const o = curO();
  const p = {}; CAT.forEach(c => p[c.key] = get(c.key));
  const L = []; const add = (hw, ok, text) => L.push({hw, ok, text});
  const miss = reqMissing();
  const all = miss.length === 0;
  add(false, all, all ? '必要なパーツはそろっている' : '未選択：' + miss.join('、'));
  if(p.cpu && p.mb) add(true, p.cpu.socket === p.mb.socket, `CPUとマザボのソケット（${p.cpu.socket} / ${p.mb.socket}）`);
  if(p.mb && p.ram) add(true, p.ram.type === p.mb.ram, `メモリ規格（${p.ram.type} / マザボ ${p.mb.ram}）`);
  if(p.mb && p.case) add(true, p.case.ff.includes(p.mb.ff), `マザボの形状がケースに対応（${p.mb.ff}）`);
  if(p.gpu && p.case) add(true, p.gpu.len <= p.case.maxGpu, `GPUの長さ（${p.gpu.len}mm / 上限 ${p.case.maxGpu}mm）`);
  if(p.cpu && p.psu){ const gt = p.gpu ? p.gpu.tdp : 0; const need = p.cpu.tdp + gt + 80; add(true, p.psu.watt >= need, `電源容量（${p.psu.watt}W / 必要 ${need}W以上）`); }
  if(p.cpu && !p.gpu) add(true, !!p.cpu.igpu, '映像出力がない（GPUか内蔵GPUのCPUが必要）');
  if(p.cpu && p.cooler) add(true, p.cooler.sockets.includes(p.cpu.socket) && p.cpu.tdp <= p.cooler.maxTdp, `クーラーの対応（熱設計 ${p.cpu.tdp}W / 上限 ${p.cooler.maxTdp}W）`);
  add(false, total() <= o.budget, `予算内（${yen(total())} / ${yen(o.budget)}）`);
  add(false, perf() >= o.minPerf, `性能スコア（${perf()} / 必要 ${o.minPerf}）`);
  return {list:L, ready: all && L.every(x => x.ok)};
}

function partModel(k){

  const add = m => { g.add(m); return m; };
  const glow = c => new THREE.MeshBasicMaterial({color:c});
  const B = (w,h,d,c,x=0,y=0,z=0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); return add(m); };
  const C = (r,h,c,x=0,y=0,z=0,facingZ=false,seg=24) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), mat(c)); m.position.set(x,y,z); if(facingZ) m.rotation.x = Math.PI/2; return add(m); };
  const T = (r,t,c,x=0,y=0,z=0) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r,t,8,32), mat(c)); m.position.set(x,y,z); return add(m); };
  const LED = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), glow(c)); m.position.set(x,y,z); return add(m); };
  switch(k){
    case 'mb': {
      const pcb = /白|ホワイト/.test(nm) ? 0xd9dee5 : /ITX/.test(nm) ? 0x262a31 : 0x1d2a22;
      B(0.4,0.015,0.36,pcb,0,0.0075,0);                       // 基板
      B(0.1,0.01,0.1,0x0d0d10,-0.05,0.012,-0.04);             // CPUソケット
      B(0.09,0.034,0.13,0x7d838c,-0.13,0.02,-0.04);           // VRMヒートシンク
      for(let i=0;i<6;i++) B(0.094,0.036,0.005,0x59606a,-0.13,0.02,-0.1+i*0.024); // フィン
      for(let i=0;i<4;i++) B(0.012,0.025,0.14, i%2===0 ? 0xf2f2f2 : 0x1a1a1a, 0.1+i*0.02,0.012,0); // メモリスロット
      B(0.28,0.012,0.014,0x111111,0,0.012,-0.14);             // PCIe x16
      B(0.1,0.01,0.012,0x111111,-0.09,0.012,-0.2);            // PCIe x1
      B(0.06,0.01,0.014,0x2a2a2a,-0.1,0.012,0.14);            // M.2スロット
      for(let i=0;i<4;i++) B(0.012,0.012,0.02,0x1a1a1a,0.12+i*0.015,0.012,0.16); // SATA
      B(0.05,0.012,0.05,0x7d8087,0.1,0.014,0.1);              // チップセット
      for(let i=0;i<4;i++) B(0.052,0.02,0.004,0x9aa0a8,0.1,0.02,0.08+i*0.012);
      for(let i=0;i<6;i++) C(0.008,0.012,i%2?0xc9a227:0x1a1a1a,0.15+(i%3)*0.02,0.012,-0.12-Math.floor(i/3)*0.02); // コンデンサ
      B(0.03,0.05,0.14,0xc0c6ce,-0.2,0.035,-0.02);            // I/Oシールド

      B(0.08,0.008,0.08,0xd0d4da,0,0.01,0);                   // IHS

function makePlant(x, z){
  const pg = new THREE.Group();

  add(new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.19,0.42,20), mat(0xb2643a))).position.y = 0.21;

  add(new THREE.Mesh(new THREE.CylinderGeometry(0.245,0.245,0.02,20), mat(0x3a2a1c))).position.y = 0.44;
  const greens = [0x2f8a4a,0x3fa35a,0x256e3a,0x58b86b,0x2b7d46,0x6cc47a];
  let seed = 11; const rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
  for(let i=0;i<9;i++){
    const a = rnd()*Math.PI*2, r = 0.05 + rnd()*0.18, h = 0.5 + rnd()*0.35;
    const stem = add(new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,h,6), mat(0x4b3a24)));
    stem.position.set(Math.cos(a)*r*0.5, 0.44 + h/2, Math.sin(a)*r*0.5);
    stem.rotation.set(Math.sin(a)*0.35, 0, -Math.cos(a)*0.35);
  }
  for(let i=0;i<22;i++){
    const a = rnd()*Math.PI*2, r = 0.08 + rnd()*0.28, y = 0.75 + rnd()*0.5;
    const leaf = add(new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), mat(greens[Math.floor(rnd()*greens.length)])));
    leaf.position.set(Math.cos(a)*r, y, Math.sin(a)*r);

  }
  pg.position.set(x, 0, z);
  return pg;
}

function installHeld(){
  if(!held || held.type !== 'part') return say('部品を持って来よう。');
  const st = S.steps[S.step];
  if(held.key !== st.key){
    S.damage++;
    camera.remove(held.mesh); partGroups[held.key].visible = true; held = null;
    SFX.wrong();
    return say(`❌ 今は${st.label}の番。違う部品だったので元の場所に戻した。`);
  }
  camera.remove(held.mesh);
  caseGroup.add(installMesh(st.key));
  held = null;
  SFX.place();
  S.screwing = true; S.screws = 0; S.screwNeed = NEED[st.key] || 3;
  say(`${st.label}を差し込んだ。ネジを${S.screwNeed}本締めよう（${K_ACT}を連打）。`);
}
function screw(){
  S.screws++;
  SFX.screw();
  if(S.screws < S.screwNeed) return say(`ネジ ${S.screws}/${S.screwNeed}`);
  const label = S.steps[S.step].label;
  S.screwing = false; S.step++;
  setTimeout(() => SFX.ding(), 150);
  say(`✅ ${label} 取付完了`);
  if(S.step >= S.steps.length){ S.phase = 'test'; say('全部取り付けた。電源ボタンを押して動作確認しよう。'); }
}

function packStep(){
  const next = PACK[S.packDone.length];
  if(!next){ S.phase = 'ship'; SFX.click(); return say('梱包完了。右奥の配送カウンターへ運ぼう。'); }
  if(next.id === 'pc'){
    if(!S.box){ SFX.error(); return say('先にダンボールを選ぼう（奥の山）。'); }
    if(!held || held.type !== 'case'){ SFX.error(); return say('本体を持って来よう（組み立て台から）。'); }
    if(BOX[S.box].size < caseSize()){ S.packMiss++; SFX.error(); return say(`❌ ${BOX[S.box].name}には入らない！`); }
    camera.remove(caseGroup); caseGroup.visible = false; held = null;
    SFX.heavy();
  } else if(next.id === 'bag') SFX.bag();
  else if(next.id === 'pad') SFX.pad();
  else if(next.id === 'acc') SFX.bag();
  else if(next.id === 'tape') SFX.tape();
  S.packDone.push(next.id);
  say(`✅ ${next.label}`);
}

function finish(){
  if(!S.ship) return;
  const sh = SHIP[S.ship], o = curO();
  S.shock = !sh.ins && Math.random() < 0.2;
  const parts = (o.repair && S.repair) ? ((PARTS[S.repair.key].find(p => p.id === S.cart[S.repair.key]) || {price:0}).price) : total();
  let q = 100 - S.damage*8 - S.packMiss*10 - S.testFail*12 - (S.shock ? 20 : 0);
  q = Math.max(0, q);
  const stars = q>=90 ? 5 : q>=75 ? 4 : q>=55 ? 3 : q>=35 ? 2 : 1;
  const tip = stars * 1000;
  const late = o.repair ? (S.day || 1) - (o.repair.deadline || 0) : 0;
  const budgetEff = o.repair ? Math.round(o.budget * (late <= 0 ? 1.3 : Math.max(0.3, 1 - 0.2*late))) : o.budget;
  const profit = budgetEff + tip - parts - BOX[S.box].cost - sh.cost;
  S.dayIncome = (S.dayIncome || 0) + budgetEff + tip;
  S.dayExpense = (S.dayExpense || 0) + parts + BOX[S.box].cost + sh.cost;
  S.money += profit; S.rep += stars;
  S.result = {q, stars, tip, parts, box:BOX[S.box].cost, ship:sh.cost, profit};
  S.phase = 'result';
  SFX.whoosh();
  setTimeout(() => SFX.cash(), 700);
  if(S.shock) setTimeout(() => SFX.wrong(), 1200);
  const msg = stars>=4 ? '届いた！想像以上にきれいな仕上がりで感動しました。また頼みます！'
            : stars>=3 ? '届きました。ちゃんと動いてるし、まあ合格かな。'
            : '届きましたけど…いろいろ気になる点があります。次は気をつけてください。';
  S.done = (S.done || 0) + 1;
  const got = ACH.filter(a => !SAVE.ach.includes(a.id) && a.ok(S, S.result));
  got.forEach(a => SAVE.ach.push(a.id));
  persist();
  openPanel(`<h3>${o.client}（${o.job}）からの返信</h3><p>「${msg}」</p>
    ${S.shock ? '<p class="ng">配送中に箱が傾いたらしく、中で何かが当たる音がしたという…</p>' : ''}
    <div style="font-size:24px;color:#ffd166;letter-spacing:2px;text-align:center">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
    <table style="width:100%;font-size:14px">
      <tr><td>売上（予算）</td><td style="text-align:right">${yen(budgetEff)}</td></tr>
      <tr><td>部品代</td><td style="text-align:right">−${yen(parts)}</td></tr>
      <tr><td>箱代</td><td style="text-align:right">−${yen(BOX[S.box].cost)}</td></tr>
      <tr><td>送料</td><td style="text-align:right">−${yen(sh.cost)}</td></tr>
      <tr><td>チップ</td><td style="text-align:right">＋${yen(tip)}</td></tr>
      <tr><td><b>利益</b></td><td style="text-align:right"><b class="${profit>=0?'ok':'ng'}">${yen(profit)}</b></td></tr>
    </table>
    <p class="muted">品質スコア ${q}（損傷・梱包ミス・動作テスト・配送の結果で決まる）</p>
    ${o.repair ? `<p class="muted">修理の期限：${o.repair.deadline}日目まで。${late <= 0 ? '期限内に直したので報酬 +30%' : `期限を${late}日過ぎたので報酬を減額`}</p>` : ''}
    ${got.map(a => `<div class="ok">🏆 実績解除：${a.name}（${a.desc}）</div>`).join('')}
    <button class="btn primary" data-act="nextOrder">次の任務を選ぶ</button>`, false);
}

function interactables(){
  const L = []; const add = (x,z,r,text,fn) => L.push({x,z,r,text,fn});
  const ph = S.phase;
  add(11.2, 9.5, 2.0, '出口（帰る）', openExit);
  add(10.5, -8.6, 2.2, '店長に話しかける', managerTalk);
  if(waitingCust()) add(0, 6.6, 2.4, 'レジ（お客さんに対応）', openRegister);
  if(S.repair && !S.repair.done && !held && partGroups[S.repair.key] && partGroups[S.repair.key].visible)
    add(partGroups[S.repair.key].position.x, partGroups[S.repair.key].position.z, 1.1, `${LABEL[S.repair.key]}の代わりを持つ`, () => pickPart(S.repair.key));
  if(S.repair && !S.repair.done && held && held.type === 'part' && held.key === S.repair.key)
    add(2, 0, 2.2, `${LABEL[S.repair.key]}を交換する`, repairSwap);
  if(ph === 'shop'){
    CAT.forEach((c,i) => add(-8.6, SHELF_Z0 + i*SHELF_DZ, 2.2, `${c.label}の棚を見る`, () => openShelf(c.key)));
    add(-3, -6, 2.6, '組み立ての準備を確認', showReadiness);
  }
  if(ph === 'build'){
    if(!S.screwing && !held) TRAY.forEach(k => {
      const g = partGroups[k];
      if(g && g.visible) add(g.position.x, g.position.z, 1.1, `${LABEL[k]}を持つ`, () => pickPart(k));
    });
    if(held && held.type === 'part' && !S.screwing) add(2, 0, 2.2, `${LABEL[held.key]}を取り付ける`, installHeld);
    if(S.screwing) add(2, 0, 2.2, `ネジを締める（${S.screws}/${S.screwNeed}）`, screw);
  }
  if(ph === 'test') add(2, 0, 2.2, '電源ボタンを押す', power);
  if(ph === 'pack'){
    if(!S.packDone.includes('pc')) add(7, -4, 2.2, 'ダンボールを選ぶ', openBox);
    if(!held && caseGroup.visible && !S.packDone.includes('pc')) add(2, 0, 2.2, '本体を持ち上げる', pickCase);
    const n = PACK[S.packDone.length];
    add(5, 3, 2.4, n ? `梱包：${n.label}` : '発送準備へ', packStep);
  }
  if(ph === 'ship') add(8, 5, 2.4, '発送手続きをする', openShip);
  return L;
}
function nearest(){
  let best = null, bd = 1e9;
  for(const it of interactables()){
    const d = Math.hypot(camera.position.x - it.x, camera.position.z - it.z);
    if(d < it.r && d < bd){ bd = d; best = it; }
  }
  return best;
}
function interact(){
  const it = nearest();
  if(it) it.fn();
}

function objBuild(){
  const st = S.steps[S.step];
  if(S.screwing) return `ネジを締める（${S.screws}/${S.screwNeed}）… ${K_ACT}を連打`;

    return `持っている部品は今の番ではない。${K_DROP}で戻して「${st.label}」を取りに行こう`;
  }
  return `次：パーツ台の「${st.label}」（光っている部品）を取りに行く（${S.step+1}/${S.steps.length}）`;
}

const joyEl = document.getElementById('joy');

let joyId = null, joyX = 0, joyY = 0;
function joyMove(e){
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2, max = r.width/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const d = Math.hypot(dx,dy);
  if(d > max){ dx *= max/d; dy *= max/d; }
  knobEl.style.transform = `translate(${dx}px,${dy}px)`;
  joyX = dx/max; joyY = dy/max;
}
joyEl.addEventListener('pointerdown', e => {
  e.preventDefault(); joyId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId); joyMove(e);
});
joyEl.addEventListener('pointermove', e => { if(e.pointerId === joyId) joyMove(e); });
const joyEnd = e => {
  if(e.pointerId !== joyId) return;
  joyId = null; joyX = 0; joyY = 0; knobEl.style.transform = '';
};
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);

function updateCustomers(dt){
  custTimer -= dt;
  if(custTimer <= 0){ spawnCustomer(); custTimer = 22 + Math.random()*26; }
  for(let i = CUST.length-1; i >= 0; i--){
    const c = CUST[i], m = c.mesh;
    if(c.state === 'walk' || c.state === 'leave'){
      const tgt = c.state === 'walk' ? CUST_SPOTS[c.slot] : CUST_ENTRY;
      const dx = tgt.x - m.position.x, dz = tgt.z - m.position.z, d = Math.hypot(dx, dz);
      if(d < 0.05){
        if(c.state === 'walk') c.state = 'wait';
        else { scene.remove(m); CUST.splice(i,1); if(REGC === c) REGC = null; }
      } else {
        const sp = Math.min(d, 1.6*dt);
        m.position.x += dx/d*sp; m.position.z += dz/d*sp; m.rotation.y = Math.atan2(dx, dz);
      }
    } else if(c.state === 'wait'){
      c.wait -= dt;
      c.waited = (c.waited || 0) + dt;
      if(staffOf('reg') > 0 && c.waited >= 8){ autoServe(c); }
      if(c.waited >= 20){
        c.bellT = (c.bellT ?? 0) - dt;
        if(c.bellT <= 0){ SFX.bell(); c.rings = (c.rings || 0) + 1; c.bellT = 12; say('チリンチリン！ レジでお客さんがベルを鳴らしている。'); }
      }
      if(c.wait <= 0){ c.state = 'leave'; S.rep = Math.max(0, S.rep - 1); say('お客さんが待ちきれず帰ってしまった…（評判 -1）'); }
    }
  }
}

  {id:'star5', name:'★5の仕事', desc:'★5の評価をもらう', ok:(st,r) => r.stars === 5},
  {id:'flawless', name:'無傷の一台', desc:'損傷・梱包ミス・動作不良ゼロで完成', ok:(st,r) => r.q === 100},
  {id:'igpu', name:'GPUなしの英断', desc:'グラフィックボードなしで完成', ok:st => !st.cart.gpu},
  {id:'itx', name:'小さな巨人', desc:'Mini-ITXのマザーボードで完成', ok:st => !!st.cart.mb && /ITX/.test((PARTS.mb.find(m => m.id === st.cart.mb) || {name:''}).name)},
  {id:'hdd8', name:'大容量派', desc:'8TBのHDDを積んで完成', ok:st => st.cart.hdd === 'd4'},
  {id:'rich', name:'億万長者の卵', desc:'所持金が100万円を超える', ok:st => st.money >= 1000000},
];
let MISSION_CANDS = [];
function openMissionChoice(){
  SFX.open();
  MISSION_CANDS = [...openMissionChoiceQueue(), ...[...ORDER_POOL].sort(() => Math.random() - 0.5).slice(0, 3 - Math.min(1, REPAIR_Q.length))];
  openPanel(`<h3>次の任務を選ぶ</h3><p class="muted">届いた注文から一件を選んで受けよう。</p>` +
    MISSION_CANDS.map((o,i) => `<button class="btn" data-act="pickMission" data-arg="${i}"><b>${o.repair ? '🔧 ' : ''}${o.client}（${o.job}${o.repair && o.repair.deadline ? '・期限 ' + o.repair.deadline + '日目まで' : ''}）</b>　予算 <span class="gold">${yen(o.budget)}</span>　必要性能 ${o.minPerf}<br><span class="muted">「${o.letter}」</span></button>`).join('') +
    (S.done > 0 ? `<button class="btn" data-act="closeShop">今日はここまで（店じまい）</button>` : ''), false);
}
function showAch(){
  if(uiOpen) return;
  SFX.open();
  openPanel(`<h3>🏆 実績・記録</h3><p>累計納品 <b class="gold">${SAVE.done || 0}</b> 件　解除 ${SAVE.ach.length}/${ACH.length}</p>` +
    ACH.map(a => `<div class="${SAVE.ach.includes(a.id) ? 'ok' : 'muted'}">${SAVE.ach.includes(a.id) ? '✅' : '🔒'} <b>${a.name}</b>　${a.desc}</div>`).join(''));
}
document.getElementById('achBtn').addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); showAch(); });
refreshContinue();

function startGame(withTut, cont){
  ensureAudio();
  if(!SAVE.started){ SAVE.started = true; writeSave(); saveCloud(); }
  document.getElementById('start').style.display = 'none';
  if(cont){ S = Object.assign(newState(), {money:SAVE.money, rep:SAVE.rep, done:SAVE.done, day:SAVE.day || 1}); tutIdx = -1; }
  else tutIdx = withTut ? 0 : -1;
  if(cont){ gameStarted = true; openMissionChoice(); }
  else { introIdx = 0; showIntro(); }
  if(withTut) showTut();
}
document.getElementById('tutYes').addEventListener('click', () => startGame(true));
document.getElementById('tutNo').addEventListener('click', () => startGame(false));

// ===== ループ =====
function move(dt){
  let f = 0, s = 0;
  if(keys.KeyW) f++; if(keys.KeyS) f--; if(keys.KeyD) s++; if(keys.KeyA) s--;
  f -= joyY; s += joyX;
  let len = Math.hypot(f,s);
  if(len < 0.01) return;
  if(len > 1){ f /= len; s /= len; }
  const sp = (held && held.type === 'case') ? 2.2 : 3.6;
  const dx = (-Math.sin(yaw)*f + Math.cos(yaw)*s) * sp * dt;
  const dz = (-Math.cos(yaw)*f - Math.sin(yaw)*s) * sp * dt;
  let moved = 0;
  if(!blocked(camera.position.x + dx, camera.position.z)){ camera.position.x += dx; moved += Math.abs(dx); }
  if(!blocked(camera.position.x, camera.position.z + dz)){ camera.position.z += dz; moved += Math.abs(dz); }
  stepDist += moved;
  if(stepDist > 0.9){ stepDist = 0; SFX.step(); }
}

function objective(){
  switch(S.phase){
    case 'order': return '注文メールを確認';
    case 'shop': {
      if(S.repair && !S.repair.done) return S.cart[S.repair.key] === S.repair.brokenId ? `故障：${LABEL[S.repair.key]}。棚で代わりを選ぼう` : `代わりの部品を部品台から持って、組み立て台で交換`;
      const miss = reqMissing();
      return miss.length ? `未選択：${miss.join('、')}（左の棚で選ぶ）` : '必要なパーツはそろった。奥の机の「組み立ての準備を確認」へ';
    }
    case 'build': return objBuild();
    case 'test': return '本体の電源ボタンを押して動作確認';
    case 'pack': { const n = PACK[S.packDone.length]; return n ? `梱包：${n.label}` : '発送準備ができた。配送カウンターへ'; }
    case 'ship': return '右奥の配送カウンターで発送';
    case 'result': return '結果を確認';
    case 'end': return '全注文完了';
  }
  return '';
}

// 次に行く場所を画面上の案内（方向と距離）で表示
function targetOf(){
  if(S.repair && !S.repair.done && S.phase === 'shop'){
    if(S.cart[S.repair.key] !== S.repair.brokenId && held) return {x:2, z:0, name:'組み立て台'};
    const i = CAT.findIndex(c => c.key === S.repair.key); return {x:-8.6, z:SHELF_Z0 + i*SHELF_DZ, name:`${LABEL[S.repair.key]}の棚`};
  }
  if(S.phase === 'shop'){
    const nk = neededKeys();
    if(nk.length){ const i = CAT.findIndex(c => c.key === nk[0]); return {x:-8.6, z:SHELF_Z0 + i*SHELF_DZ, name:`${LABEL[nk[0]]}の棚`}; }
    return {x:-3, z:-6, name:'奥の机（組み立ての準備）'};
  }
  if(S.phase === 'build'){
    const st = S.steps[S.step];
    if(!S.screwing && !held && st){ const g = partGroups[st.key]; if(g && g.visible) return {x:g.position.x, z:g.position.z, name:`${LABEL[st.key]}（パーツ台）`}; }
    return {x:2, z:0, name:'組み立て台'};
  }
  if(S.phase === 'test') return {x:2, z:0, name:'電源ボタン（組み立て台）'};
  if(S.phase === 'pack'){
    if(!S.box) return {x:7, z:-4, name:'ダンボール'};
    if(!held && caseGroup.visible && !S.packDone.includes('pc')) return {x:2, z:0, name:'本体（組み立て台）'};
    return {x:5, z:3, name:'梱包台'};
  }
  if(S.phase === 'ship') return {x:8, z:5, name:'配送カウンター'};
  return null;
}
function updateTarget(){
  const el = document.getElementById('target');
  const t = uiOpen ? null : targetOf();
  if(!t){ el.textContent = ''; return; }
  const dx = t.x - camera.position.x, dz = t.z - camera.position.z;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const deg = Math.atan2(dx*rx + dz*rz, dx*fx + dz*fz) * 180 / Math.PI;
  const dist = Math.hypot(dx, dz);
  const dir = Math.abs(deg) < 20 ? '↑ 前方' : Math.abs(deg) > 150 ? '↓ 後ろ' : deg > 0 ? '→ 右' : '← 左';
  el.textContent = `▶ ${t.name}：${dir}（約${dist.toFixed(1)}m）`;
}

// 手（一人称の腕）：持つ物に手を移す
scene.add(camera);
const HANDS = new THREE.Group(); camera.add(HANDS);
const SKIN = 0xf1c6a0, SLEEVE = 0x3a4a66;
const HAND = {};
const hvec = {L:new THREE.Vector3(-0.3,-0.42,-0.55), R:new THREE.Vector3(0.3,-0.42,-0.55)};
['L','R'].forEach(side => {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.34), mat(SLEEVE)); HANDS.add(arm);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.08,0.1), mat(SKIN)); HANDS.add(hand);
  HAND[side] = {arm, hand};
});
function updateHands(dt){
  const anc = held ? (held.type === 'part' ? held.mesh.position : held.type === 'case' ? caseGroup.position : null) : null;
  const t = {
    L: anc ? new THREE.Vector3(anc.x-0.13, anc.y-0.03, anc.z+0.03) : new THREE.Vector3(-0.3,-0.42,-0.55),
    R: anc ? new THREE.Vector3(anc.x+0.13, anc.y-0.03, anc.z+0.03) : new THREE.Vector3(0.3,-0.42,-0.55),
  };
  ['L','R'].forEach(side => {
    hvec[side].lerp(t[side], Math.min(1, dt*10));
    const v = hvec[side];
    HAND[side].hand.position.copy(v);
    HAND[side].arm.position.set(v.x*1.05, v.y-0.12, v.z+0.22);
    HAND[side].arm.rotation.x = 0.35;
  });
}

let last = performance.now();
let touchAct = false, screwHold = 0;
const promptEl = document.getElementById('prompt');
let tutShown = -2;
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if(!uiOpen) move(dt);
  if(gameStarted){
    updateCustomers(dt);
    restockT += dt; if(restockT >= restockPeriod()){ restockT = 0; restockAll(); }
    dayClock += dt; if(dayClock >= DAY_SEC){ dayClock = 0; if(S.phase !== 'end') endOfDay(); }
  }
  updateHands(dt);
  updateClock();
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  updateTut();
  if(tutIdx !== tutShown){ tutShown = tutIdx; showTut(); }
  // 次に使う部品を光らせて（上下させて）分かりやすくする
  const hiKey = (S.phase === 'build' && !S.screwing && !held && S.steps[S.step]) ? S.steps[S.step].key : null;
  for(const k in partGroups){
    const g = partGroups[k];
    g.position.y = g.userData.baseY + ((k === hiKey && g.visible) ? 0.12 + 0.06*Math.sin(t/250) : 0);
  }

  document.getElementById('obj').textContent = '目標：' + objective();
  document.getElementById('stat').textContent = `所持金 ${yen(S.money)}　評判 ${S.rep}　${S.day || 1}日目　累計 ${S.done || 0}件　損傷 ${S.damage}`;
  document.getElementById('total').textContent = `選んだパーツ合計 ${yen(total())} ／ 予算 ${yen(curO().budget)}`;

  updateTarget();
  const near = uiOpen ? null : nearest();
  if(near){ promptEl.textContent = (isTouch ? '' : '[E] ') + near.text; promptEl.style.display = 'block'; }
  else promptEl.style.display = 'none';
  if(isTouch){
    btnAct.textContent = near ? near.text : '調べる';
    btnAct.classList.toggle('dim', !near);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
rebuildPartsTable();
requestAnimationFrame(loop);
</script>
