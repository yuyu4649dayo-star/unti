#mute{right:12px}

.btn.on{border-color:#3ddc97}
.btn.primary{background:#6c8cff;text-align:center;font-weight:bold;border:none}

// ===== 端末判定 =====
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if(isTouch) document.body.classList.add('touch');
const K_ACT = isTouch ? '「調べる」ボタン' : 'Eキー';
const K_DROP = isTouch ? '「置く」ボタン' : 'Qキー';
document.getElementById('startText').innerHTML = isTouch
  ? '左下のスティックで歩く　画面の右側をなぞって見回す<br>右下の「調べる」で取る・取り付ける・押す　「置く」で部品を戻す<br>注文メールは右上の📩で読み返せます'
  : 'WASD：歩く　マウス：見回す　E：調べる・取る・取り付ける<br>Q：持っている部品を元に戻す　Esc：マウスを解放<br>注文メールは右上の📩で読み返せます';

// ===== 効果音（Web Audioで合成。音声ファイル不要） =====
let actx = null, muted = false;
function ensureAudio(){
  if(!actx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    actx = new C();
  }
  if(actx.state === 'suspended') actx.resume();
}
function tone({f=440, f2=null, dur=0.12, type='sine', vol=0.2, delay=0, attack=0.005}){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise({dur=0.1, vol=0.2, delay=0, hp=null, bp=null}){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter();
  if(bp){ filt.type = 'bandpass'; filt.frequency.value = bp; }
  else { filt.type = 'highpass'; filt.frequency.value = hp || 800; }
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(filt); filt.connect(g); g.connect(actx.destination);
  src.start(t);
}
const SFX = {
  click(){ tone({f:900, dur:0.04, type:'square', vol:0.06}); },
  open(){ tone({f:520, f2:780, dur:0.1, type:'triangle', vol:0.12}); },
  pickup(){ tone({f:330, f2:520, dur:0.12, type:'triangle', vol:0.15}); noise({dur:0.05, vol:0.06, hp:1200}); },
  heavy(){ tone({f:140, f2:220, dur:0.2, type:'sine', vol:0.25}); noise({dur:0.12, vol:0.12, hp:300}); },
  place(){ noise({dur:0.05, vol:0.25, hp:1500}); tone({f:200, f2:110, dur:0.08, type:'square', vol:0.08}); },
  screw(){ noise({dur:0.025, vol:0.18, bp:3500}); tone({f:2400, dur:0.02, type:'square', vol:0.03}); },
  wrong(){ tone({f:170, f2:110, dur:0.3, type:'sawtooth', vol:0.12}); },
  error(){ tone({f:220, dur:0.12, type:'square', vol:0.08}); tone({f:180, dur:0.12, delay:0.15, type:'square', vol:0.08}); },
  power(){ [523,659,784].forEach((f,i) => tone({f, dur:0.18, type:'triangle', vol:0.15, delay:i*0.1})); noise({dur:0.8, vol:0.03, hp:200}); },
  success(){ [523,659,784,1047].forEach((f,i) => tone({f, dur:0.25, type:'triangle', vol:0.16, delay:i*0.12})); },
  fail(){ tone({f:320, f2:140, dur:0.55, type:'sawtooth', vol:0.14}); },
  bag(){ noise({dur:0.14, vol:0.1, hp:2800}); },
  pad(){ noise({dur:0.18, vol:0.12, hp:500}); },
  box(){ noise({dur:0.1, vol:0.12, hp:600}); tone({f:120, f2:60, dur:0.12, type:'sine', vol:0.2}); },
  tape(){ noise({dur:0.3, vol:0.2, hp:2500}); },
  whoosh(){ noise({dur:0.6, vol:0.14, bp:1200}); },
  cash(){ tone({f:1319, dur:0.08, type:'square', vol:0.08}); tone({f:1760, dur:0.22, type:'square', vol:0.08, delay:0.08}); },
  step(){ noise({dur:0.035, vol:0.05, hp:400}); },
  ding(){ tone({f:1047, dur:0.25, type:'sine', vol:0.12}); },
};
function setMuted(v){
  muted = v;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}
const muteEl = document.getElementById('mute');
muteEl.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); setMuted(!muted); if(!muted) SFX.click(); });
document.addEventListener('pointerdown', ensureAudio);

  if(p.mb && p.ram) add(true, p.ram.type === p.mb.ram, `メモリ規格（${p.ram.type} / マザボ ${p.mb.ram}）`);
  if(p.mb && p.case) add(true, p.case.ff.includes(p.mb.ff), `マザボの形状がケースに対応（${p.mb.ff}）`);
  if(p.gpu && p.case) add(true, p.gpu.len <= p.case.maxGpu, `GPUの長さ（${p.gpu.len}mm / 上限 ${p.case.maxGpu}mm）`);
  if(p.cpu && p.psu){ const gt = p.gpu ? p.gpu.tdp : 0; const need = p.cpu.tdp + gt + 80; add(true, p.psu.watt >= need, `電源容量（${p.psu.watt}W / 必要 ${need}W以上）`); }
  if(p.cpu && !p.gpu) add(true, !!p.cpu.igpu, '映像出力がない（GPUか内蔵GPUのCPUが必要）');
  if(p.cpu && p.cooler) add(true, p.cooler.sockets.includes(p.cpu.socket) && p.cpu.tdp <= p.cooler.maxTdp, `クーラーの対応（熱設計 ${p.cpu.tdp}W / 上限 ${p.cooler.maxTdp}W）`);
  add(false, total() <= o.budget, `予算内（${yen(total())} / ${yen(o.budget)}）`);
  add(false, perf() >= o.minPerf, `性能スコア（${perf()} / 必要 ${o.minPerf}）`);
  return {list:L, ready: all && L.every(x => x.ok)};
}

function partModel(k){
  const p = get(k) || {name:''};
  const g = new THREE.Group();
  const B = (w,h,d,c,x=0,y=0,z=0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); g.add(m); return m; };
  const C = (r,h,c,x=0,y=0,z=0,facingZ=false) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20), mat(c)); m.position.set(x,y,z); if(facingZ) m.rotation.x = Math.PI/2; g.add(m); return m; };
  switch(k){
    case 'mb': {
      B(0.4,0.015,0.36,0x1f6b35);                       // 基板（緑）
      B(0.1,0.01,0.1,0x111111,-0.05,0.012,-0.04);       // CPUソケット
      B(0.08,0.03,0.12,0x8a8e96,-0.13,0.02,-0.04);      // VRMヒートシンク
      for(let i=0;i<4;i++) B(0.012,0.025,0.14,0x111111,0.1+i*0.02,0.012,0); // メモリスロット
      B(0.28,0.012,0.014,0x111111,0,0.012,-0.14);       // PCIeスロット
      B(0.06,0.01,0.014,0x2a2a2a,-0.1,0.012,0.14);      // M.2スロット
      B(0.05,0.012,0.05,0x7d8087,0.1,0.014,0.1);        // チップセットヒートシンク
      C(0.01,0.01,0xc9a227,0.15,0.01,-0.1);             // 電解コンデンサ
      break;
    }
    case 'cpu': {
      B(0.1,0.006,0.1,0x2a2a2a,0,0.003,0);              // 基板
      B(0.08,0.008,0.08,0xd0d4da,0,0.01,0);             // IHS（ヒートスプレッダ）
      break;
    }
    case 'cooler': {
      C(0.035,0.02,0x9aa0a8,0,0.01,0);                  // ベース
      for(let i=0;i<8;i++){
        const a = i*Math.PI/4;
        const f = B(0.1,0.1,0.01,0xb8bec6, Math.cos(a)*0.05, 0.07, Math.sin(a)*0.05);
        f.rotation.y = -a;
      }
      C(0.055,0.02,0x2c2f36,0,0.14,0);                  // ファン（上部）
      break;
    }
    case 'ram': {
      const heat = p.type === 'DDR5' ? 0xd0d4da : 0x1a1a1a;
      for(let i=0;i<2;i++){
        const x = i*0.02;
        B(0.012,0.1,0.14,0x101418,x,0.05,0);            // 基板
        B(0.016,0.1,0.13,heat,x,0.06,0);                // ヒートスプレッダ
      }
      break;
    }
    case 'gpu': {
      const acc = /RX/.test(p.name) ? 0xed1c24 : 0x76b900;
      B(0.3,0.12,0.04,0x1b1b1f,0,0.06,0);               // クーラー部
      B(0.3,0.12,0.005,0x333333,0,0.06,-0.022);         // バックプレート
      B(0.3,0.006,0.042,acc,0,0.003,0);                 // アクセントライン
      C(0.045,0.01,0x111111,-0.075,0.06,0.022,true);    // ファン
      C(0.045,0.01,0x111111,0.075,0.06,0.022,true);
      break;
    }
    case 'psu': {
      B(0.2,0.12,0.2,0x2a2c31,0,0.06,0);                // 本体
      C(0.07,0.01,0x111111,0,0.06,0.101,true);          // ファングリル
      B(0.05,0.02,0.01,0xcfd4dc,0.06,0.02,0.102);        // シール
      break;
    }
    case 'storage': {
      B(0.08,0.008,0.024,0x1b1b1b,0,0.004,0);           // SSD基板
      B(0.07,0.002,0.02,COLOR.storage,0,0.009,0);       // ラベル
      break;
    }
    case 'hdd': {
      B(0.15,0.04,0.1,0x3a3f48,0,0.02,0);               // 本体
      B(0.148,0.002,0.098,0x9aa0a8,0,0.041,0);          // 天板
      B(0.03,0.008,0.02,0xc0c0c0,0.06,0.02,0.05);       // SATAコネクタ
      break;
    }
    case 'fan': {
      B(0.12,0.12,0.025,0x161616,0,0,0);                // フレーム
      C(0.052,0.005,0x2b2b33,0,0,0.013,true);           // ファン面
      C(0.012,0.012,0x0a0a0a,0,0,0.02,true);            // ハブ
      for(let i=0;i<7;i++){
        const a = i*2*Math.PI/7;
        const bl = B(0.04,0.008,0.004,0x3a3f48, Math.cos(a)*0.025, Math.sin(a)*0.025, 0.017);
        bl.rotation.z = a;
      }
      break;
    }
  }
  return g;
}

  const c = get('case'); const n = c ? c.name : '';
  const col = n==='ガラスミドル' ? 0xdff3ff : n==='フルタワー' ? 0xbfd6e6 : n==='スリムミニ' ? 0xf0f4f8 : n==='ミニケース' ? 0xcfe2ee : 0xbfe0f2;
  caseBody.material.color.setHex(col);
  caseFront.material.color.setHex(col);
  caseGlass.material.color.setHex(col);
  caseGroup.children.filter(m => m.userData.caseName).forEach(m => caseGroup.remove(m));
  if(n){ const l = label(n); l.position.set(0,1.15,0); l.userData.caseName = true; caseGroup.add(l); }
}

function installMesh(k){
  const m = partModel(k);
  const p = PLACE[k] || [0,0,0];
  m.position.set(p[0], p[1], p[2]);
  m.userData.inst = true;
  return m;
}

let packBoxMesh = null;
function showPackBox(){
  if(packBoxMesh) scene.remove(packBoxMesh);
  const d = BOX[S.box].dim;
  packBoxMesh = addBox(d, d*0.6, d, 0xc89b5b, 5, 0.94 + d*0.3, 3);
}

// ===== パーツ台 =====
let partGroups = {};
function makePartGroup(k, withLabel){
  const g = new THREE.Group();
  g.add(partModel(k));
  if(withLabel){ const s = label(LABEL[k]); s.position.set(0,0.55,0); g.add(s); }
  return g;
}
function rebuildPartsTable(){
  Object.values(partGroups).forEach(g => scene.remove(g));
  partGroups = {};
  TRAY.forEach((k,i) => {
    if(!S.cart[k]) return;
    const g = makePartGroup(k, true);
    g.position.set(-5.7 + (i%5)*0.9, 0.94, -0.5 + Math.floor(i/5)*0.9);
    g.userData.baseY = 0.94;
    scene.add(g); partGroups[k] = g;
  });
  refreshShelves();
}

// ===== 持ち物 =====
let held = null;
camera.position.set(-1, 1.6, 4);
let yaw = 0, pitch = 0;
const keys = {};
let stepDist = 0;

function pickPart(k){
  if(held) return say(`両手がふさがっている。${K_DROP}で元に戻そう。`);
  const g = partGroups[k]; if(!g) return;
  g.visible = false;
  const h = makePartGroup(k, false);
  h.position.set(0.35,-0.3,-0.8);
  h.rotation.y = 0.5;
  camera.add(h);
  held = {type:'part', key:k, mesh:h};
  SFX.pickup();
  say(`${LABEL[k]}を持った。組み立て台の前で${K_ACT}で取り付け。`);
}
function pickCase(){
  if(held) return say('両手がふさがっている。');
  camera.add(caseGroup);
  caseGroup.position.set(0.25,-0.45,-1.0);
  caseGroup.rotation.set(0,0,0);
  caseGroup.scale.setScalar(0.6);
  held = {type:'case'};
  SFX.heavy();
  say('本体を持ち上げた。梱包台まで運ぼう。');
}
function dropHeld(){
  if(!held) return;
  if(held.type === 'part'){
    camera.remove(held.mesh); partGroups[held.key].visible = true;
    held = null; SFX.place(); say('元の場所に置いた。');
  } else {
    say('本体は梱包台まで運ぼう。');
  }
}

// ===== 操作 =====
function installHeld(){
  if(!held || held.type !== 'part') return say('部品を持って来よう。');
  const st = S.steps[S.step];
  if(held.key !== st.key){
    S.damage++;
    camera.remove(held.mesh); partGroups[held.key].visible = true; held = null;
    SFX.wrong();
    return say(`❌ 今は${st.label}の番。違う部品だったので元の場所に戻した。`);
  }
  camera.remove(held.mesh);
  caseGroup.add(installMesh(st.key));
  held = null;
  SFX.place();
  S.screwing = true; S.screws = 0; S.screwNeed = NEED[st.key] || 3;
  say(`${st.label}を差し込んだ。ネジを${S.screwNeed}本締めよう（${K_ACT}を押し続ける）。`);
}
function screw(){
  S.screws++;
  SFX.screw();
  if(S.screws < S.screwNeed) return say(`ネジ ${S.screws}/${S.screwNeed}`);
  const label = S.steps[S.step].label;
  S.screwing = false; S.step++;
  setTimeout(() => SFX.ding(), 150);
  say(`✅ ${label} 取付完了`);
  if(S.step >= S.steps.length){ S.phase = 'test'; say('全部取り付けた。電源ボタンを押して動作確認しよう。'); }
}
function startBuild(){
  const c = checks();
  if(!c.ready){
    const bad = c.list.find(x => !x.ok);
    SFX.error();
    return say(`まだ準備できていない：${bad ? bad.text : ''}`);
  }
  S.phase = 'build'; S.step = 0; S.screws = 0; S.screwing = false; S.damage = 0;
  S.steps = STEPS.filter(s => S.cart[s.key]);
  styleCase();
  caseGroup.children.filter(c => c.userData.inst).forEach(c => caseGroup.remove(c));
  SFX.click();
  say('作業台に部品はそろった。手順どおりに取り付けよう。');
}
function power(){
  const hw = checks().list.filter(x => x.hw);
  S.testFail = (S.damage >= 3 ? 1 : 0) + hw.filter(x => !x.ok).length;
  const ok = S.testFail === 0;
  SFX.power();
  setTimeout(() => ok ? SFX.success() : SFX.fail(), 900);
  const extra = S.damage >= 3 ? `<div class="ng">❌ 一部パーツの接触不良（損傷 ${S.damage}）</div>` : '';
  openPanel(`<h3>電源ON</h3>
    <p>${ok ? '画面にロゴ。BIOSも問題なし。OSが立ち上がった…完璧だ。' : '起動はしたが、何かがおかしい…。このまま渡すわけにはいかない。'}</p>` +
    hw.map(x => `<div class="${x.ok?'ok':'ng'}">${x.ok?'✅':'❌'} ${x.text}</div>`).join('') + extra +
    `<p class="muted">ベンチマーク：約${Math.round(perf()*1.3)} fps</p>
     <button class="btn primary" data-act="toPack">梱包へ進む</button>`, false);
}
function openBox(){
  if(S.packDone.includes('pc')) { SFX.error(); return say('もう封をしたあとだ…'); }
  openPanel(`<h3>ダンボールを選ぶ</h3><p class="muted">本体のサイズに合う箱を選ぼう。</p>` +
    Object.entries(BOX).map(([k,b]) => `<button class="btn ${S.box===k?'on':''}" data-act="setBox" data-arg="${k}">${S.box===k?'✅ ':''}${b.name}　<span class="gold">${yen(b.cost)}</span></button>`).join(''));
}
function packStep(){
  const next = PACK[S.packDone.length];
  if(!next){ S.phase = 'ship'; SFX.click(); return say('梱包完了。右奥の配送カウンターへ運ぼう。'); }
  if(next.id === 'pc'){
    if(!S.box){ SFX.error(); return say('先にダンボールを選ぼう（奥の山）。'); }
    if(!held || held.type !== 'case'){ SFX.error(); return say('本体を持って来よう（組み立て台から）。'); }
    if(BOX[S.box].size < caseSize()){ S.packMiss++; SFX.error(); return say(`❌ ${BOX[S.box].name}には入らない！`); }
    camera.remove(caseGroup); caseGroup.visible = false; held = null;
    SFX.heavy();
  } else if(next.id === 'bag') SFX.bag();
  else if(next.id === 'pad') SFX.pad();
  else if(next.id === 'acc') SFX.bag();
  else if(next.id === 'tape') SFX.tape();
  S.packDone.push(next.id);
  say(`✅ ${next.label}`);
}
function openShip(){
  SFX.open();
  openPanel(`<h3>配送カウンター</h3><p class="muted">送り方を選んでください。</p>` +
    Object.entries(SHIP).map(([k,s]) => `<button class="btn ${S.ship===k?'on':''}" data-act="setShip" data-arg="${k}">${S.ship===k?'✅ ':''}${s.name}　<span class="gold">${yen(s.cost)}</span>／${s.days}日${s.ins?'／配送事故を補償':''}</button>`).join('') +
    `<button class="btn primary" data-act="shipNow" ${S.ship?'':'disabled'}>📦 発送する</button>`);
}
function finish(){
  if(!S.ship) return;
  const sh = SHIP[S.ship], o = ORDERS[S.orderIdx];
  S.shock = !sh.ins && Math.random() < 0.2;
  const parts = total();
  let q = 100 - S.damage*8 - S.packMiss*10 - S.testFail*12 - (S.shock ? 20 : 0);
  q = Math.max(0, q);
  const stars = q>=90 ? 5 : q>=75 ? 4 : q>=55 ? 3 : q>=35 ? 2 : 1;
  const tip = stars * 1000;
  const profit = o.budget + tip - parts - BOX[S.box].cost - sh.cost;
  S.money += profit; S.rep += stars;
  S.result = {q, stars, tip, parts, box:BOX[S.box].cost, ship:sh.cost, profit};
  S.phase = 'result';
  SFX.whoosh();
  setTimeout(() => SFX.cash(), 700);
  if(S.shock) setTimeout(() => SFX.wrong(), 1200);
  const msg = stars>=4 ? '届いた！想像以上にきれいな仕上がりで感動しました。また頼みます！'
            : stars>=3 ? '届きました。ちゃんと動いてるし、まあ合格かな。'
            : '届きましたけど…いろいろ気になる点があります。次は気をつけてください。';
  openPanel(`<h3>${o.client}（${o.job}）からの返信</h3><p>「${msg}」</p>
    ${S.shock ? '<p class="ng">配送中に箱が傾いたらしく、中で何かが当たる音がしたという…</p>' : ''}
    <div style="font-size:24px;color:#ffd166;letter-spacing:2px;text-align:center">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
    <table style="width:100%;font-size:14px">
      <tr><td>売上（予算）</td><td style="text-align:right">${yen(o.budget)}</td></tr>
      <tr><td>部品代</td><td style="text-align:right">−${yen(parts)}</td></tr>
      <tr><td>箱代</td><td style="text-align:right">−${yen(BOX[S.box].cost)}</td></tr>
      <tr><td>送料</td><td style="text-align:right">−${yen(sh.cost)}</td></tr>
      <tr><td>チップ</td><td style="text-align:right">＋${yen(tip)}</td></tr>
      <tr><td><b>利益</b></td><td style="text-align:right"><b class="${profit>=0?'ok':'ng'}">${yen(profit)}</b></td></tr>
    </table>
    <p class="muted">品質スコア ${q}（損傷・梱包ミス・動作テスト・配送の結果で決まる）</p>
    <button class="btn primary" data-act="nextOrder">${S.orderIdx < ORDERS.length-1 ? '次の注文へ' : '全注文の結果を見る'}</button>`, false);
}

// ===== インタラクト =====
function interactables(){
  const L = []; const add = (x,z,r,text,fn) => L.push({x,z,r,text,fn});
  const ph = S.phase;
  if(ph === 'shop'){
    CAT.forEach((c,i) => add(-8.6, SHELF_Z0 + i*SHELF_DZ, 2.2, `${c.label}の棚を見る`, () => openShelf(c.key)));
    add(-3, -6, 2.6, '組み立ての準備を確認', showReadiness);
  }
  if(ph === 'build'){
    if(!S.screwing && !held) TRAY.forEach(k => {
      const g = partGroups[k];
      if(g && g.visible) add(g.position.x, g.position.z, 1.1, `${LABEL[k]}を持つ`, () => pickPart(k));
    });
    if(held && held.type === 'part' && !S.screwing) add(2, 0, 2.2, `${LABEL[held.key]}を取り付ける`, installHeld);
    if(S.screwing) add(2, 0, 2.2, `ネジを押し続けて締める（${S.screws}/${S.screwNeed}）`, () => {});
  }
  if(ph === 'test') add(2, 0, 2.2, '電源ボタンを押す', power);
  if(ph === 'pack'){
    if(!S.packDone.includes('pc')) add(7, -4, 2.2, 'ダンボールを選ぶ', openBox);
    if(!held && caseGroup.visible && !S.packDone.includes('pc')) add(2, 0, 2.2, '本体を持ち上げる', pickCase);
    const n = PACK[S.packDone.length];
    add(5, 3, 2.4, n ? `梱包：${n.label}` : '発送準備へ', packStep);
  }
  if(ph === 'ship') add(8, 5, 2.4, '発送手続きをする', openShip);
  return L;
}
function nearest(){
  let best = null, bd = 1e9;
  for(const it of interactables()){
    const d = Math.hypot(camera.position.x - it.x, camera.position.z - it.z);
    if(d < it.r && d < bd){ bd = d; best = it; }
  }
  return best;
}
function interact(){
  if(S.screwing) return;
  const it = nearest();
  if(it) it.fn();
}

// ===== UI =====
const panelEl = document.getElementById('panel');
const pboxEl = document.getElementById('pbox');
const pcloseEl = document.getElementById('pclose');
pcloseEl.addEventListener('click', () => { if(uiOpen && pcloseEl.style.display !== 'none'){ SFX.click(); closePanel(); } });
let uiOpen = false;
function openPanel(html, closable = true){
  uiOpen = true;
  pboxEl.innerHTML = html + (closable ? `<button class="btn" data-act="close">閉じる</button>` : '');
  pcloseEl.style.display = closable ? 'block' : 'none';
  panelEl.style.display = 'flex';
  document.exitPointerLock?.();
}
function closePanel(){
  uiOpen = false;
  panelEl.style.display = 'none';
  const p = renderer.domElement.requestPointerLock?.();
  if(p && p.catch) p.catch(() => {});
}
pboxEl.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const a = t.dataset.act;
  if(a === 'close'){ SFX.click(); return closePanel(); }
  if(ACT[a]) ACT[a](t.dataset.arg);
});

let toastTimer = null;
function say(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 4200);
}

// 組み立て前の準備チェック（何が足りないか、なぜ組めないかを表示）
function showReadiness(){
  SFX.open();
  const c = checks();
  const miss = reqMissing();
  const rows = c.list.filter(x => x.ok !== undefined).map(x => `<div class="${x.ok?'ok':'ng'}">${x.ok?'✅':'❌'} ${x.text}</div>`).join('');
  openPanel(`<h3>組み立ての準備</h3>
    <p>選んだパーツの合計：<b class="gold">${yen(total())}</b>　予算：${yen(ORDERS[S.orderIdx].budget)}</p>
    ${miss.length ? `<p class="ng">まだ選んでいない：${miss.join('、')}</p>` : ''}
    ${rows}
    ${c.ready ? '<p class="ok">準備OK！ 組み立てを始められます。</p>' : '<p class="muted">❌の項目を直すと組み立てを始められます。棚でパーツを選び直せます。</p>'}
    <button class="btn primary" data-act="startBuild" ${c.ready ? '' : 'disabled'}>組み立てを始める</button>`);
}
// 組み立て中の「次にやること」
function objBuild(){
  const st = S.steps[S.step];
  if(S.screwing) return `ネジを締める（${S.screws}/${S.screwNeed}）… ${K_ACT}を押し続ける`;
  if(held && held.type === 'part'){
    if(held.key === st.key) return `「${st.label}」を持っている。組み立て台の前で${K_ACT}で取り付け`;
    return `持っている部品は今の番ではない。${K_DROP}で戻して「${st.label}」を取りに行こう`;
  }
  return `次：パーツ台の「${st.label}」（光っている部品）を取りに行く（${S.step+1}/${S.steps.length}）`;
}

const ACT = {
  startBuild(){ if(checks().ready){ closePanel(); startBuild(); } else showReadiness(); },
  accept(){ S.phase = 'shop'; SFX.click(); closePanel(); say('注文を受けた。左の棚から部品を選ぼう。'); },
  setPart(arg){
    const [k,id] = arg.split('|');
    S.cart[k] = id;
    rebuildPartsTable();
    SFX.click();
    closePanel();
    say(`${LABEL[k]}：${get(k).name} を選んだ。`);
  },
  setBox(arg){
    S.box = arg; showPackBox(); SFX.box(); closePanel();
    say(`${BOX[arg].name}を用意した。`);
  },
  toPack(){
    S.phase = 'pack'; S.packDone = []; S.packMiss = 0;
    SFX.click(); closePanel(); say('本体を梱包台まで運ぼう。まずはダンボールを選ぶ。');
  },
  setShip(arg){ S.ship = arg; SFX.click(); openShip(); },
  shipNow(){ finish(); },
  nextOrder(){
    SFX.click();
    if(S.orderIdx >= ORDERS.length - 1){ S.phase = 'end'; return openEnd(); }
    const keep = {money:S.money, rep:S.rep, orderIdx:S.orderIdx + 1};
    S = Object.assign(newState(), keep);
    resetWorld();
    openOrder();
  },
  restart(){ SFX.click(); tutIdx = -1; ORDERS = shuffledOrders(); S = newState(); resetWorld(); openOrder(); },
};

function resetWorld(){
  if(held && held.type === 'part') camera.remove(held.mesh);
  held = null;
  scene.add(caseGroup);
  caseGroup.position.set(2,0.94,0);
  caseGroup.rotation.set(0,0,0);
  caseGroup.scale.setScalar(1);
  caseGroup.visible = true;
  caseGroup.children.filter(c => c.userData.inst).forEach(c => caseGroup.remove(c));
  if(packBoxMesh){ scene.remove(packBoxMesh); packBoxMesh = null; }
  rebuildPartsTable();
}

// ===== キーボード・マウス（PC用） =====
document.addEventListener('keydown', e => {
  if(e.repeat) return;
  keys[e.code] = true;
  if(uiOpen) return;
  if(e.code === 'KeyE') interact();
  if(e.code === 'KeyQ') dropHeld();
});
document.addEventListener('keyup', e => keys[e.code] = false);
document.addEventListener('mousemove', e => {
  if(document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0025;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.0025));
});
renderer.domElement.addEventListener('click', () => {
  if(!uiOpen && document.pointerLockElement !== renderer.domElement){
    const p = renderer.domElement.requestPointerLock?.();
    if(p && p.catch) p.catch(() => {});
  }
});

// ===== タッチ操作（iPad用） =====
const joyEl = document.getElementById('joy');
const knobEl = document.getElementById('knob');
const btnAct = document.getElementById('btnAct');
const btnDrop = document.getElementById('btnDrop');
let joyId = null, joyX = 0, joyY = 0;
function joyMove(e){
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2, max = r.width/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const d = Math.hypot(dx,dy);
  if(d > max){ dx *= max/d; dy *= max/d; }
  knobEl.style.transform = `translate(${dx}px,${dy}px)`;
  joyX = dx/max; joyY = dy/max;
}
joyEl.addEventListener('pointerdown', e => {
  e.preventDefault(); joyId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId); joyMove(e);
});
joyEl.addEventListener('pointermove', e => { if(e.pointerId === joyId) joyMove(e); });
const joyEnd = e => {
  if(e.pointerId !== joyId) return;
  joyId = null; joyX = 0; joyY = 0; knobEl.style.transform = '';
};
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);

btnAct.addEventListener('pointerdown', e => { e.preventDefault(); touchAct = true; if(!uiOpen){ SFX.click(); interact(); } });
['pointerup','pointercancel','pointerleave'].forEach(ev => btnAct.addEventListener(ev, () => { touchAct = false; }));
btnDrop.addEventListener('pointerdown', e => { e.preventDefault(); if(!uiOpen) dropHeld(); });

// 画面の右側をなぞって見回す
let lookId = null, lookX = 0, lookY = 0;
const UI_SEL = '#joy,#btnAct,#btnDrop,#panel,#mute,#mailBtn,#tut,#start';
window.addEventListener('pointerdown', e => {
  if(e.pointerType !== 'touch' || uiOpen) return;
  if(e.target.closest && e.target.closest(UI_SEL)) return;
  if(lookId === null){ lookId = e.pointerId; lookX = e.clientX; lookY = e.clientY; }
});
window.addEventListener('pointermove', e => {
  if(e.pointerId !== lookId) return;
  yaw -= (e.clientX - lookX) * 0.006;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - (e.clientY - lookY) * 0.006));
  lookX = e.clientX; lookY = e.clientY;
});
const lookEnd = e => { if(e.pointerId === lookId) lookId = null; };
window.addEventListener('pointerup', lookEnd);
window.addEventListener('pointercancel', lookEnd);

// 画面の拡大・スクロールを防ぐ（パネル内のスクロールは許可）
window.addEventListener('touchmove', e => { if(!e.target.closest || !e.target.closest('#panel')) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ===== 開始 =====
function startGame(withTut){
  ensureAudio();
  ORDERS = shuffledOrders();
  document.getElementById('start').style.display = 'none';
  tutIdx = withTut ? 0 : -1;
  openOrder();
  if(withTut) showTut();
}
document.getElementById('tutYes').addEventListener('click', () => startGame(true));
document.getElementById('tutNo').addEventListener('click', () => startGame(false));

// ===== ループ =====
function move(dt){
  let f = 0, s = 0;
  if(keys.KeyW) f++; if(keys.KeyS) f--; if(keys.KeyD) s++; if(keys.KeyA) s--;
  f -= joyY; s += joyX;
  let len = Math.hypot(f,s);
  if(len < 0.01) return;
  if(len > 1){ f /= len; s /= len; }
  const sp = (held && held.type === 'case') ? 2.2 : 3.6;
  const dx = (-Math.sin(yaw)*f + Math.cos(yaw)*s) * sp * dt;
  const dz = (-Math.cos(yaw)*f - Math.sin(yaw)*s) * sp * dt;
  let moved = 0;
  if(!blocked(camera.position.x + dx, camera.position.z)){ camera.position.x += dx; moved += Math.abs(dx); }
  if(!blocked(camera.position.x, camera.position.z + dz)){ camera.position.z += dz; moved += Math.abs(dz); }
  stepDist += moved;
  if(stepDist > 0.9){ stepDist = 0; SFX.step(); }
}

function objective(){
  switch(S.phase){
    case 'order': return '注文メールを確認';
    case 'shop': {
      const miss = reqMissing();
      return miss.length ? `未選択：${miss.join('、')}（左の棚で選ぶ）` : '必要なパーツはそろった。奥の机の「組み立ての準備を確認」へ';
    }
    case 'build': return objBuild();
    case 'test': return '本体の電源ボタンを押して動作確認';
    case 'pack': { const n = PACK[S.packDone.length]; return n ? `梱包：${n.label}` : '発送準備ができた。配送カウンターへ'; }
    case 'ship': return '右奥の配送カウンターで発送';
    case 'result': return '結果を確認';
    case 'end': return '全注文完了';
  }
  return '';
}

// 次に行く場所を画面上の案内（方向と距離）で表示
function targetOf(){
  if(S.phase === 'shop'){
    const nk = neededKeys();
    if(nk.length){ const i = CAT.findIndex(c => c.key === nk[0]); return {x:-8.6, z:SHELF_Z0 + i*SHELF_DZ, name:`${LABEL[nk[0]]}の棚`}; }
    return {x:-3, z:-6, name:'奥の机（組み立ての準備）'};
  }
  if(S.phase === 'build'){
    const st = S.steps[S.step];
    if(!S.screwing && !held && st){ const g = partGroups[st.key]; if(g && g.visible) return {x:g.position.x, z:g.position.z, name:`${LABEL[st.key]}（パーツ台）`}; }
    return {x:2, z:0, name:'組み立て台'};
  }
  if(S.phase === 'test') return {x:2, z:0, name:'電源ボタン（組み立て台）'};
  if(S.phase === 'pack'){
    if(!S.box) return {x:7, z:-4, name:'ダンボール'};
    if(!held && caseGroup.visible && !S.packDone.includes('pc')) return {x:2, z:0, name:'本体（組み立て台）'};
    return {x:5, z:3, name:'梱包台'};
  }
  if(S.phase === 'ship') return {x:8, z:5, name:'配送カウンター'};
  return null;
}
function updateTarget(){
  const el = document.getElementById('target');
  const t = uiOpen ? null : targetOf();
  if(!t){ el.textContent = ''; return; }
  const dx = t.x - camera.position.x, dz = t.z - camera.position.z;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const deg = Math.atan2(dx*rx + dz*rz, dx*fx + dz*fz) * 180 / Math.PI;
  const dist = Math.hypot(dx, dz);
  const dir = Math.abs(deg) < 20 ? '↑ 前方' : Math.abs(deg) > 150 ? '↓ 後ろ' : deg > 0 ? '→ 右' : '← 左';
  el.textContent = `▶ ${t.name}：${dir}（約${dist.toFixed(1)}m）`;
}

let last = performance.now();
let touchAct = false, screwHold = 0;
const promptEl = document.getElementById('prompt');
let tutShown = -2;
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if(!uiOpen) move(dt);
  if(S.screwing && !uiOpen && (keys.KeyE || touchAct)){
    screwHold += dt;
    if(screwHold >= 0.8){ screwHold = 0; screw(); }
  } else screwHold = 0;
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  updateTut();
  if(tutIdx !== tutShown){ tutShown = tutIdx; showTut(); }
  // 次に使う部品を光らせて（上下させて）分かりやすくする
  const hiKey = (S.phase === 'build' && !S.screwing && !held && S.steps[S.step]) ? S.steps[S.step].key : null;
  for(const k in partGroups){
    const g = partGroups[k];
    g.position.y = g.userData.baseY + ((k === hiKey && g.visible) ? 0.12 + 0.06*Math.sin(t/250) : 0);
  }

  document.getElementById('obj').textContent = '目標：' + objective();
  document.getElementById('stat').textContent = `所持金 ${yen(S.money)}　評判 ${S.rep}　注文 ${Math.min(S.orderIdx+1, ORDERS.length)}/${ORDERS.length}　損傷 ${S.damage}`;
  document.getElementById('total').textContent = `選んだパーツ合計 ${yen(total())} ／ 予算 ${yen(ORDERS[S.orderIdx].budget)}`;

  updateTarget();
  const near = uiOpen ? null : nearest();
  if(near){ promptEl.textContent = (isTouch ? '' : '[E] ') + near.text; promptEl.style.display = 'block'; }
  else promptEl.style.display = 'none';
  if(isTouch){
    btnAct.textContent = near ? near.text : '調べる';
    btnAct.classList.toggle('dim', !near);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
rebuildPartsTable();
requestAnimationFrame(loop);
</script>
